<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5a3ff5"><title>АгроСенс — платформа для агронома</title>
<meta name="description" content="Контроль самосогревания в хранилищах картофеля, овощей и зерна">
<style>
:root{--p:#5a3ff5;--p2:#4329d9;--lime:#c6f51f;--bg:#f3f1fb;--card:#fff;--t:#1d1b2e;--m:#6b6880;--ok:#b5e61d;--watch:#ffe066;--warn:#ffa630;--crit:#ff4d6d;--line:#ebe8f6}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t)}
header{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:14px 16px 6px;padding-top:max(14px,env(safe-area-inset-top))}
header .top{display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:1100px;margin:auto}
header h1{margin:0;font-size:22px;color:var(--lime);letter-spacing:.3px}header small{opacity:.85;font-size:12px}
.chip{background:rgba(255,255,255,.15);border-radius:20px;padding:4px 10px;font-size:12px;white-space:nowrap}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 12px;background:var(--p2);position:sticky;top:0;z-index:5;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;border-radius:12px;padding:9px 13px;background:rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:14px;cursor:pointer}
nav button.on{background:var(--lime);color:var(--t)}.badge{background:var(--crit);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:4px}
main{padding:14px;max-width:1100px;margin:auto;padding-bottom:40px}h2{margin:6px 0 2px}.sub{color:var(--m);font-size:13px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:16px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 12px rgba(60,40,160,.07)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}@media(min-width:800px){.kpis{grid-template-columns:repeat(4,1fr)}.grid4{grid-template-columns:repeat(4,1fr)!important}.two{grid-template-columns:1fr 1fr!important}}
.kpi{background:#fff;border-radius:18px;padding:14px;box-shadow:0 2px 12px rgba(60,40,160,.07)}.kpi b{font-size:26px;color:var(--p);display:block}.kpi.main{background:var(--p);color:#fff}.kpi.main b{color:var(--lime)}.kpi span{font-size:12px;color:var(--m)}.kpi.main span{color:#ddd}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.two{display:grid;grid-template-columns:1fr;gap:12px}
.sec{border:2px solid transparent;border-radius:16px;padding:10px;background:#faf9ff;cursor:pointer;transition:transform .15s}.sec:active{transform:scale(.98)}.sec.warn{border-color:var(--warn)}.sec.crit{border-color:var(--crit);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,77,109,.15)}}
.sec h3{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:4px;flex-wrap:wrap}
.dots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;justify-items:center;margin:6px 0}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid rgba(0,0,0,.12)}.dot.nd{background:repeating-linear-gradient(45deg,#ddd 0 3px,#f5f5f5 3px 6px)!important}
.pill{border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700;white-space:nowrap}
.l0{background:var(--ok)}.l1{background:var(--watch)}.l2{background:var(--warn)}.l3{background:var(--crit);color:#fff}.l4{background:#ddd}
.bar{height:8px;background:#eceaf7;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;transition:width .4s}
.tiny{font-size:12px;color:var(--m)}select,input,textarea{font:inherit;font-size:16px;padding:9px;border:1px solid #dcd8ec;border-radius:10px;background:#fff;max-width:100%;color:var(--t)}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:var(--p);color:#fff;font-size:14px;cursor:pointer}.btn.alt{background:#e9e5ff;color:var(--p)}.btn.red{background:var(--crit)}.btn:disabled{opacity:.5}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.list>div{padding:10px 0;border-bottom:1px solid var(--line)}.list>div:last-child{border:0}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--m);font-weight:600}
canvas{width:100%;height:220px}.msg{padding:10px 12px;border-radius:14px;margin:6px 0;white-space:pre-wrap;line-height:1.4}.me{background:#e9e5ff;margin-left:15%}.ai{background:#f4f4f8;margin-right:8%}
.msg .src{display:block;font-size:11px;color:var(--m);margin-top:4px}
.f{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.f:last-child{border:0}.f input,.f select{width:100%}.f.w{grid-template-columns:1fr}
.seg{display:flex;background:#eeebfb;border-radius:12px;padding:3px;gap:3px}.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-weight:600;color:var(--m);cursor:pointer}.seg button.on{background:#fff;color:var(--p);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.note{background:#fff8e1;border-radius:12px;padding:10px;font-size:13px;margin-top:8px}.okn{background:#effbd0}.errn{background:#ffe3e8}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--t);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;opacity:0;transition:.3s;pointer-events:none}.toast.on{opacity:1}
footer{padding:12px;text-align:center;font-size:12px;color:var(--m)}
</style></head><body>

<footer id="foot"></footer>

function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
function excess(h,t){if(!h.mit)return Math.min(MAX,Math.max(0,h.rate*(t-h.start)/36e5));return h.ex0*Math.pow(.5,Math.max(0,(t-h.mt)/36e5)/HL)}
function gen(t){const daily=Math.sin(t/864e5*2*Math.PI)*.15;for(let s=0;s<S;s++)for(let r=0;r<R;r++)for(let d=0;d<D;d++){const k=key(s,r,d);if(offline[k])continue;
let v=4.5+secOff[s]+rodOff[s][r]+d*.15+daily+(rnd()-.5)*.12,c=1200+(rnd()-.5)*60;for(const h of hot)if(h.s==s&&h.r==r){const e=excess(h,t);v+=h.d==d?e:e*.35;c+=(h.d==d?e:e*.35)*250}

for(let k=144;k>=1;k--)gen(now-k*STEP);
const last=k=>{const a=hist[k];return a[a.length-1]};
function rate(k){const a=hist[k],n=a.length,b=a[Math.max(0,n-13)];return (a[n-1][1]-b[1])/((a[n-1][0]-b[0])/36e5||1)}
const median=a=>{a=[...a].sort((x,y)=>x-y);const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2};
function point(s,r,d){const k=key(s,r,d),[lt,v]=last(k),stale=(now-lt)/6e4>C.staleMinutes;if(stale)return{v,delta:0,rt:0,l:4,co2:0,stale:true};
let nb=[],nc=[];for(let rr=0;rr<R;rr++)if(rr!=r){const kk=key(s,rr,d);if((now-last(kk)[0])/6e4<=C.staleMinutes){nb.push(last(kk)[1]);nc.push(co2h[kk].at(-1))}}

function section(s){let pts=[],mx=0,md=-99,eta=null,nd=0;for(let d=0;d<D;d++)for(let r=0;r<R;r++){const p=point(s,r,d);p.r=r;p.d=d;pts.push(p);if(p.stale){nd++;continue}mx=Math.max(mx,p.l);
if(p.delta>md)md=p.delta;if(p.rt>.1){const e=(C.tempCrit-p.v)/p.rt;if(e>0&&(eta==null||e<eta))eta=e}}

async function ask(q){if(busy)return;chat.push(['me',q]);busy=true;go('Ассистент ИИ');let a,src;
if(C.aiType=='OLLAMA'){try{a=await ollamaChat(q);src='Ollama · '+C.ollamaModel}catch(e){a=offlineAnswer(q);src='Встроенный аналитик (Ollama недоступна: '+(e.name=='AbortError'?'таймаут':e.message)+')'}}
else{a=offlineAnswer(q);src='Встроенный аналитик'}chat.push(['ai',a,src]);busy=false;if(tab=='Ассистент ИИ')render()}
function aiV(){return`<h2>Ассистент ИИ</h2><div class="sub">${C.aiType=='OLLAMA'?'Локальная модель Ollama · '+esc(C.ollamaModel)+' · '+esc(C.ollamaUrl):'Встроенный аналитик (работает без интернета)'} · <a href="#" onclick="go('Настройки');return false">изменить</a></div><div class="card">${chat.length?chat.map(([w,t,s])=>`<div class="msg ${w}">${esc(t)}${s?`<span class="src">${esc(s)}</span>`:''}</div>`).join(''):'<div class="tiny">Спросите, например: «Что происходит в хранилище?» или «Какой порядок отгрузки?»</div>'}
${busy?'<div class="msg ai">Думаю…</div>':''}
<div class="row" style="margin-top:8px"><input id="q" style="flex:1" placeholder="Ваш вопрос" onkeydown="if(event.key=='Enter'&&this.value)ask(this.value)"><button class="btn" ${busy?'disabled':''} onclick="q.value&&ask(q.value)">Спросить</button></div>
<div class="row" style="margin-top:8px"><button class="btn alt" onclick="ask('Что происходит в хранилище?')">Что происходит?</button><button class="btn alt" onclick="ask('Какой порядок отгрузки?')">Порядок отгрузки</button>${chat.length?'<button class="btn alt" onclick="chat=[];render()">Очистить</button>':''}</div></div>`}
// ---------- Настройки ----------
const num=(k,l,st)=>`<label class="f"><span>${l}</span><input type="number" step="${st||'any'}" value="${C[k]}" onchange="setC('${k}',+this.value)"></label>`;
const txt=(k,l)=>`<label class="f w"><span>${l}</span><input value="${esc(C[k])}" onchange="setC('${k}',this.value.trim())"></label>`;
const chk=(k,l)=>`<label class="f"><span>${l}</span><input type="checkbox" style="width:22px;height:22px;justify-self:end" ${C[k]?'checked':''} onchange="setC('${k}',this.checked)"></label>`;
function setC(k,v){if(typeof DEF[k]=='number'&&!isFinite(v))return toast('Неверное число');C[k]=v;saveC();if(k=='simSpeed')restartTimer();if(k=='notify'&&v&&'Notification'in window)Notification.requestPermission();toast('Сохранено');render()}
let ollamaStatus='';
async function testOllama(){ollamaStatus='<div class="note">Проверяю подключение…</div>';render();try{const r=await fetch(C.ollamaUrl.replace(/\/+$/,'')+'/api/tags');if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json(),ms=(j.models||[]).map(m=>m.name);
ollamaStatus=`<div class="note okn">✔ Ollama на связи. Модели: ${ms.length?ms.map(m=>`<a href="#" onclick="setC('ollamaModel','${esc(m)}');return false">${esc(m)}</a>`).join(', '):'не установлены — выполните <code>ollama pull llama3.2</code>'}${ms.length&&!ms.some(m=>m==C.ollamaModel||m.split(':')[0]==C.ollamaModel)?'<br>⚠ Модель «'+esc(C.ollamaModel)+'» не найдена — нажмите на одну из списка.':''}</div>`}
catch(e){ollamaStatus=`<div class="note errn">✖ Не удалось подключиться: ${esc(e.message)}.<br>Проверьте, что Ollama запущена с разрешением для браузера (OLLAMA_ORIGINS="*") и что адрес верный.</div>`}render()}
function settingsV(){const https=location.protocol=='https:'&&/^http:/.test(C.ollamaUrl)&&!/localhost|127\.0\.0\.1/.test(C.ollamaUrl);return`<h2>Настройки</h2><div class="sub">Сохраняются на этом устройстве</div>
<div class="two"><div>
<div class="card"><h3>Хранилище</h3>${txt('storeName','Название')}${num('capacity','Вместимость, т',1)}</div>
<div class="card"><h3>Ассистент ИИ</h3><div class="seg"><button class="${C.aiType=='OFFLINE'?'on':''}" onclick="setC('aiType','OFFLINE')">Встроенный</button><button class="${C.aiType=='OLLAMA'?'on':''}" onclick="setC('aiType','OLLAMA')">Ollama</button></div>
${C.aiType=='OLLAMA'?`${txt('ollamaUrl','Адрес Ollama')}${txt('ollamaModel','Модель')}${num('ollamaTemp','Температура ответа (0–1)',.1)}
<div class="row" style="margin-top:8px"><button class="btn" onclick="testOllama()">Проверить подключение</button></div>${ollamaStatus}
${https?'<div class="note errn">Сайт открыт по https, а Ollama — по http: браузер может заблокировать запрос. Используйте https-туннель (например, ngrok) или откройте сайт локально.</div>':''}
<div class="note"><b>Как подключить:</b><br>1. Установите Ollama с ollama.com и выполните <code>ollama pull llama3.2</code>.<br>2. Запустите с доступом из браузера и сети:<br><code>OLLAMA_ORIGINS="*" OLLAMA_HOST=0.0.0.0 ollama serve</code><br>3. С телефона укажите адрес компьютера в сети, например <code>http://192.168.1.10:11434</code>.<br>Если Ollama недоступна, отвечает встроенный аналитик.</div>`:'<div class="tiny" style="margin-top:8px">Встроенный аналитик работает без интернета и без установки.</div>'}</div>
<div class="card"><h3>Демо и уведомления</h3>${num('simSpeed','Ускорение времени, ×',1)}${chk('sound','Звук при тревоге')}${chk('notify','Уведомления браузера')}</div>
</div><div>
<div class="card"><h3>Пороги анализа</h3><div class="tiny">Условные значения; подбирайте под культуру и хранилище.</div>
${num('watchDelta','Наблюдение: Δ от соседних, °C')}${num('warnDelta','Предупреждение: Δ, °C')}${num('critDelta','Критично: Δ, °C')}
${num('watchRate','Наблюдение: рост, °C/ч')}${num('warnRate','Предупреждение: рост, °C/ч')}${num('critRate','Критично: рост, °C/ч')}
${num('tempWarn','Абсолютная T предупреждения, °C')}${num('tempCrit','Абсолютная T критично, °C')}
${num('co2WatchDelta','CO₂ наблюдение: Δ, ppm',50)}${num('co2WarnDelta','CO₂ предупреждение: Δ, ppm',50)}${num('staleMinutes','Датчик «молчит» через, мин',1)}</div>
<div class="card"><h3>Данные</h3><div class="row"><button class="btn alt" onclick="exportData()">Экспорт JSON</button><button class="btn red" onclick="if(confirm('Сбросить все настройки и партии?')){localStorage.removeItem('agrosens.settings');localStorage.removeItem('agrosens.batches');location.reload()}">Сбросить всё</button></div></div>
</div></div>`}
function exportData(){const b=new Blob([JSON.stringify({settings:C,batches,alerts},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='agrosens-export.json';a.click()}
function render(){navR();const v={'Обзор':overview,'Секция':secView,'Оповещения':alertsV,'Отгрузка':shipV,'Партии':batchV,'Ассистент ИИ':aiV,'Настройки':settingsV}[tab];
document.getElementById('main').innerHTML=v();chart();clock.textContent='демо · '+fmt(now);foot.textContent=`Демо-режим: данные датчиков смоделированы. Время ускорено ×${C.simSpeed}.`}
let timer;function restartTimer(){clearInterval(timer);timer=setInterval(()=>{now+=STEP;gen(now);check();const a=document.activeElement;if(a&&(a.tagName=='INPUT'||a.tagName=='SELECT'))return navR();
if(['Обзор','Секция','Оповещения','Отгрузка'].includes(tab))render();else{navR();clock.textContent='демо · '+fmt(now)}},Math.max(200,STEP/Math.max(1,C.simSpeed)))}

function passUrl(b){const x=section(b.sec-1),d={id:b.id,c:b.crop,s:b.sec,t:b.t,d:b.date,st:C.storeName,l:x.lvl,T:+x.avg.toFixed(1),at:now};return location.href.split('#')[0]+'#p='+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(d)))))}
function qrSvg(t){const q=qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true})}
function showQR(i){const b=batches[i],u=passUrl(b);modal(`<h3>Паспорт партии ${b.id}</h3><div class="tiny">${esc(b.crop)} · секция ${b.sec} · ${b.t} т</div><div style="background:#fff;padding:8px;max-width:280px;margin:10px auto">${qrSvg(u)}</div><div class="tiny">Отсканируйте телефоном, чтобы открыть паспорт партии. В QR — состояние на ${fmt(now)}.</div><div class="row" style="margin-top:10px"><button class="btn" onclick="printQR()">Печать этикетки</button><button class="btn alt" onclick="navigator.clipboard&&navigator.clipboard.writeText('${u}').then(()=>toast('Ссылка скопирована'))">Копировать ссылку</button><button class="btn alt" onclick="modal()">Закрыть</button></div>`)}
function printQR(){const w=open('','_blank');w.document.write('<html><body style="font-family:sans-serif;text-align:center">'+document.getElementById('mbox').innerHTML.replace(/<div class="row"[\s\S]*$/,'')+'<script>onload=()=>print()<\/script></body></html>');w.document.close()}
function modal(html){let m=document.getElementById('modal');if(!html){m&&m.remove();return}if(!m){m=document.createElement('div');m.id='modal';m.style.cssText='position:fixed;inset:0;background:rgba(20,10,60,.5);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px';m.onclick=e=>{if(e.target==m)modal()};document.body.appendChild(m)}m.innerHTML=`<div class="card" id="mbox" style="max-width:420px;width:100%;margin:0">${html}</div>`}
function passportFromHash(){const m=location.hash.match(/^#p=(.+)$/);if(!m)return false;try{const d=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
document.getElementById('nav').innerHTML='';document.getElementById('main').innerHTML=`<h2>Паспорт партии ${esc(d.id)}</h2><div class="sub">${esc(d.st)}</div><div class="card"><table>
<tr><th>Культура</th><td>${esc(d.c)}</td></tr><tr><th>Секция</th><td>${d.s}</td></tr><tr><th>Масса</th><td>${d.t} т</td></tr><tr><th>Закладка</th><td>${esc(d.d)}</td></tr>
<tr><th>Состояние</th><td>${pill(d.l)}</td></tr><tr><th>Средняя T</th><td>${n1(d.T)} °C</td></tr><tr><th>Данные на</th><td>${fmt(d.at)}</td></tr></table></div>
<div class="card"><b>Рекомендация:</b> ${rec(d.l)}</div><button class="btn" onclick="location.hash='';location.reload()">Открыть платформу</button>`;clock.textContent='паспорт партии';return true}catch(e){return false}}
if(!passportFromHash()){check();render();restartTimer();}
</script></body></html>
